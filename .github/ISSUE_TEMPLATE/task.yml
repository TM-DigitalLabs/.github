name: Zadanie
description: Zgłoś zadanie, nową funkcjonalność lub ulepszenie
title: ""
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Opisz zadanie możliwie konkretnie. Szablon ma ułatwić realizację zarówno człowiekowi, jak i agentowi AI.

  - type: textarea
    id: goal
    attributes:
      label: Cel
      description: Co powinno zostać osiągnięte?
      placeholder: Opisz oczekiwany rezultat.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Kontekst
      description: Dlaczego to zadanie jest potrzebne? Dodaj informacje istotne dla jego realizacji.
      placeholder: Opisz kontekst biznesowy, produktowy lub techniczny.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Wymagania
      description: Wymień wymagania, które powinny zostać spełnione.
      placeholder: |
        - Wymaganie 1
        - Wymaganie 2
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Kryteria akceptacji
      description: Po czym będzie wiadomo, że zadanie zostało wykonane poprawnie?
      placeholder: |
        - [ ] Kryterium 1
        - [ ] Kryterium 2
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Poza zakresem
      description: Co świadomie nie należy do tego zadania?
      placeholder: Wymień elementy, których nie należy implementować lub zmieniać.

  - type: textarea
    id: verification
    attributes:
      label: Weryfikacja
      description: Jak należy sprawdzić poprawność wykonania zadania?
      placeholder: |
        - testy
        - lint
        - typecheck
        - ręczna weryfikacja
