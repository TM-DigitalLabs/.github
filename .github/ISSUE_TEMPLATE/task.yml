name: Zadanie techniczne
description: Zgłoś zadanie techniczne, porządkowe lub utrzymaniowe
title: ""
labels:
  - chore
type: Task

body:
  - type: markdown
    attributes:
      value: |
        Użyj tego formularza dla prac technicznych, utrzymaniowych i porządkowych,
        które nie wprowadzają nowej funkcjonalności produktu.

  - type: textarea
    id: goal
    attributes:
      label: Cel
      description: Co powinno zostać wykonane?
      placeholder: Opisz oczekiwany rezultat zadania.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Kontekst
      description: Dlaczego zadanie jest potrzebne?
      placeholder: Opisz przyczynę, problem techniczny lub kontekst utrzymaniowy.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Zakres
      description: Jakich obszarów powinno dotyczyć zadanie?
      placeholder: |
        - Obszar 1
        - Obszar 2
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Wymagania
      description: Jakie wymagania powinny zostać spełnione?
      placeholder: |
        - Wymaganie 1
        - Wymaganie 2
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Kryteria akceptacji
      description: Po czym będzie wiadomo, że zadanie zostało wykonane poprawnie?
      placeholder: |
        - [ ] Kryterium 1
        - [ ] Kryterium 2
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Ograniczenia i zasady
      description: Czy istnieją ograniczenia techniczne lub obszary, których nie należy zmieniać?
      placeholder: |
        - nie zmieniaj zachowania funkcjonalnego
        - zachowaj kompatybilność
        - nie dodawaj nowych zależności

  - type: textarea
    id: verification
    attributes:
      label: Weryfikacja
      description: Jak należy sprawdzić poprawność wykonania zadania?
      placeholder: |
        - testy
        - lint
        - typecheck
        - build
        - ręczna weryfikacja
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Materiały pomocnicze
      description: Powiązane Issue, PR, dokumentacja lub inne materiały.
      placeholder: |
        - #123
        - link do dokumentacji

  - type: checkboxes
    id: readiness
    attributes:
      label: Gotowość
      options:
        - label: Zadanie zawiera wystarczający kontekst do samodzielnej realizacji.
          required: true
        - label: Kryteria akceptacji są jednoznaczne i możliwe do zweryfikowania.
          required: true